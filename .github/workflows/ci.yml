name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv clean
      - name: Install only the wheel and exercise its bundled demo
        run: |
          clean/bin/pip install --no-index --find-links dist lifeos-engine
          clean/bin/lifeos demo
          clean/bin/lifeos selftest
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "test (py3.10)", os: ubuntu-latest, python: "3.10"}
          - {name: "test (py3.11)", os: ubuntu-latest, python: "3.11"}
          - {name: "test", os: ubuntu-latest, python: "3.12"}
          - {name: "test (py3.13)", os: ubuntu-latest, python: "3.13"}
          - {name: "test (windows)", os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
      - name: Privacy guard on every tracked file
        run: lifeos guard $(git ls-files)

