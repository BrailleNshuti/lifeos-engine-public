name: soak
# Runs the full suite three times on Windows with the os.replace diagnostics on, and prints how often the short retry
# fired or failed. Weekly and on demand; it only reads the repository. Added 2026-11-27 to catch the rare Windows write
# failure (winerror 5) that has not been reproduced on demand by a full run.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - name: Three full runs with diagnostics
        shell: bash
        run: |
          python scripts/soak.py --runs 3 | tee soak.txt
      - name: Helper commands on the demo home
        shell: bash
        env:
          LIFEOS_HOME: examples/demo-home
        run: |
          lifeos selfcheck
          python scripts/refresh_cockpit.py --out "$RUNNER_TEMP/cockpit-export"
          lifeos next
      - name: Counts in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Soak, 3 full runs on Windows"
            echo '```'
            grep -E "^run |runs," soak.txt || echo "no result lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
