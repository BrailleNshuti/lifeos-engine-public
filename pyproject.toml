[project]
name = "lifeos-engine"
version = "0.5.0"
description = "The machinery of a personal AI operating system: task files, weekly numbers, context packs and a privacy guard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lifeos = "lifeos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lifeos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
